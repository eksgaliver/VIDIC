            tcpSocket:
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: srikaya-media-pvc
---
# ------------------------------------------------------------------------------
# BAGIAN 13: SERVICE STORAGE (CLUSTERIP :3002)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: storage-service
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: microservice
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3002
      targetPort: 3002
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: storage-service
---
# ------------------------------------------------------------------------------
# BAGIAN 14: API GATEWAY & REVERSE PROXY AGGREGATOR (PORT 3000)
# Menggabungkan authApp, shiftingApp, storageApp ke /api serta peladen statis /storage
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: gateway-service
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: api-gateway
    visualizer.k8s.io/flow-step: "tier-3-gateway-aggregator"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: gateway-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: gateway-service
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: gateway-service
          image: srikaya/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: GATEWAY_PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: AUTH_SERVICE_URL
            - name: SHIFTING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: SHIFTING_SERVICE_URL
            - name: STORAGE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: STORAGE_SERVICE_URL
            - name: STORAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: STORAGE_DIR
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: NODE_ENV
          volumeMounts:
            - name: media-storage
              mountPath: /storage
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: srikaya-media-pvc
---
# ------------------------------------------------------------------------------
# BAGIAN 15: SERVICE API GATEWAY (CLUSTERIP :3000)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: gateway-service
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: api-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: gateway-service
---
# ------------------------------------------------------------------------------
# BAGIAN 16: KLIEN ANTARMUKA PENGGUNA (REACT 19 SPA CLIENT HUB :80)
# Menyajikan antarmuka Dasbor, Perusahaan, Departemen, Shift, Postingan & Sub-User
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: web-client
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: frontend
    visualizer.k8s.io/flow-step: "tier-4-presentation-spa"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: web-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: web-client
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: web-client
          image: srikaya/web-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
# ------------------------------------------------------------------------------
# BAGIAN 17: SERVICE KLIEN WEB (CLUSTERIP :80)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: web-client
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: web-client
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: web-client
---
# ------------------------------------------------------------------------------
# BAGIAN 18: PENGATUR LALU LINTAS EKSTERNAL (INGRESS ROUTER)
# Merutekan jalur luar: /api dan /storage ke Gateway; / ke Web Client
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: srikaya-ingress
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: ingress-controller
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: edge-routing
    visualizer.k8s.io/flow-step: "tier-5-edge-entrypoint"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
    - host: srikaya.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  number: 80
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /storage
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  number: 80
---
# ------------------------------------------------------------------------------
# BAGIAN 19: ARUS KONEKTIVITAS JARINGAN 1 (INGRESS -> GATEWAY & WEB)
# ------------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flow-1-ingress-to-gateway-and-web
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/flow: "ingress-to-edge"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["gateway-service", "web-client"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 80

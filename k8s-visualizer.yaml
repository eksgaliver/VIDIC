# ------------------------------------------------------------------------------
# BAGIAN 12: MIKROSERVIS PENYIMPANAN & OPTIMASI BERKAS WEBP (PORT 3002)
# Menangani unggahan gambar, segregasi folder dinamis, dan kompresi WebP
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: storage-service
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: microservice
    visualizer.k8s.io/flow-step: "tier-2-core-service"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: storage-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: storage-service
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: storage-service
          image: srikaya/storage-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: STORAGE_SERVICE_PORT
            - name: STORAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config

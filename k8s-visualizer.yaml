# ==============================================================================
# SRIKAYA PLATFORM &middot; MASTER ARCHITECTURE & WORKFLOW KUBERNETES MANIFEST
# ==============================================================================
# Berkas deklaratif tunggal yang merangkum seluruh alur sistem secara berjenjang
# dari lalu lintas eksternal (Ingress) hingga ke basis data dan volume penyimpanan.
#
# PETA ALUR ARSITEKTUR LENGKAP (END-TO-END SYSTEM FLOW):
#
#   [ 1. TRAFFIC MASUK ]  -->  [ 2. INGRESS CONTROLLER ] (srikaya.local)
#                                      |
#                  +-------------------+-------------------+
#                  | Path: /                               | Path: /api & /storage
#                  v                                       v
#         [ 3. WEB CLIENT ]                       [ 4. API GATEWAY ]
#         (React 19 SPA :80)                      (Bun Reverse Proxy :3000)
#                  |                                       |
#                  |                               +-------+-------+
#                  |                               |       |       |
#                  |                               v       v       v
#                  |                      +--------+   +---+---+   +-------+
#                  |                      | AUTH   |   | SHIFT |   | STORE |
#                  |                      | (:3001)|   | (:3003|   | (:3002|
#                  |                      +--------+   +---+---+   +-------+
#                  |                          |            |           |
#                  |                          v            v           v
#                  |                      +--------------------+  +------------+
#                  +--------------------> | POSTGRESQL DB:5432 |  | MEDIA PVC  |
#                                         | (StatefulSet)      |  | (Shared 20G|
#                                         +--------------------+  +------------+
#                                                   |
#                                         [ POSTGRES PVC:10G ]
#
# ==============================================================================

# ------------------------------------------------------------------------------
# BAGIAN 1: ISOLASI RUANG NAMA (NAMESPACE)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/part-of: srikaya-platform
    environment: production
    visualizer.k8s.io/layer: foundation
---
# ------------------------------------------------------------------------------
# BAGIAN 2: KONFIGURASI GLOBAL SISTEM (CONFIGMAP)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: srikaya-config
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: configuration
data:
  APP_NAME: "Srikaya Enterprise"
  NODE_ENV: "production"
  GATEWAY_PORT: "3000"
  AUTH_SERVICE_PORT: "3001"
  STORAGE_SERVICE_PORT: "3002"
  SHIFTING_SERVICE_PORT: "3003"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  STORAGE_SERVICE_URL: "http://storage-service:3002"
  SHIFTING_SERVICE_URL: "http://shifting-service:3003"
  STORAGE_DIR: "/storage"
---
# ------------------------------------------------------------------------------
# BAGIAN 3: KUNCI KEAMANAN & KREDENSIAL RAHASIA (SECRET)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: srikaya-secret
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: security
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:srikaya_secure_pass_2026@postgres-service:5432/srikaya_auth"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "srikaya_secure_pass_2026"
  POSTGRES_DB: "srikaya_auth"
  JWT_SECRET: "srikaya-enterprise-jwt-secret-key-2026"
---
# ------------------------------------------------------------------------------
# BAGIAN 4: PENYIMPANAN PERSISTEN BERSAMA (MEDIA & ASSETS STORAGE PVC)
# Digunakan bersama oleh storage-service (write/kompresi WebP) & gateway (serve static)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srikaya-media-pvc
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: media-storage
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: persistence
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
# ------------------------------------------------------------------------------
# BAGIAN 5: PENYIMPANAN BASIS DATA (POSTGRESQL DATA PVC)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srikaya-postgres-pvc
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database-storage
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: persistence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# ------------------------------------------------------------------------------
# BAGIAN 6: BASIS DATA UTAMA (POSTGRESQL 16 STATEFULSET)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: datastore
    visualizer.k8s.io/flow-step: "tier-1-data-store"
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: srikaya-postgres-pvc
---
# ------------------------------------------------------------------------------
# BAGIAN 7: SERVICE BASIS DATA POSTGRESQL (CLUSTERIP :5432)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: datastore
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database
---
# ------------------------------------------------------------------------------
# BAGIAN 8: MIKROSERVIS AUTENTIKASI, MULTI-TENANT & ORGANISASI (PORT 3001)
# Mengelola JWT auth, batasan isolasi tenant, sub-user, perusahaan, departemen, karyawan, postingan
# ------------------------------------------------------------------------------

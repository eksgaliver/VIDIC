kind: Deployment
metadata:
  name: auth-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: auth-service
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: microservice
    visualizer.k8s.io/flow-step: "tier-2-core-service"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: auth-service
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: auth-service
          image: srikaya/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: AUTH_SERVICE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: NODE_ENV
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
# ------------------------------------------------------------------------------
# BAGIAN 9: SERVICE AUTENTIKASI (CLUSTERIP :3001)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: auth-service
    app.kubernetes.io/part-of: srikaya-platform
    visualizer.k8s.io/layer: microservice
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: auth-service
---

# ==============================================================================
# Srikaya Platform &middot; Master Kubernetes Manifest (All-in-One Topology)
# Runtime: Bun + ElysiaJS Microservices + PostgreSQL 16 + React 19 Client
# Designed for high-clarity rendering in Kubernetes Visualizers (Lens, Octant, Monokle, etc.)
# ==============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/part-of: srikaya-platform
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: srikaya-config
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: srikaya-platform
data:
  APP_NAME: "Srikaya Enterprise"
  NODE_ENV: "production"
  GATEWAY_PORT: "3000"
  AUTH_SERVICE_PORT: "3001"
  STORAGE_SERVICE_PORT: "3002"
  SHIFTING_SERVICE_PORT: "3003"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  STORAGE_SERVICE_URL: "http://storage-service:3002"
  SHIFTING_SERVICE_URL: "http://shifting-service:3003"
  STORAGE_DIR: "/storage"
---
apiVersion: v1
kind: Secret
metadata:
  name: srikaya-secret
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: srikaya-platform
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:srikaya_secure_pass_2026@postgres-service:5432/srikaya_auth"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "srikaya_secure_pass_2026"
  POSTGRES_DB: "srikaya_auth"
  JWT_SECRET: "srikaya-enterprise-jwt-secret-key-2026"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srikaya-media-pvc
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: media-storage
    app.kubernetes.io/part-of: srikaya-platform
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: srikaya-postgres-pvc
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database-storage
    app.kubernetes.io/part-of: srikaya-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: srikaya-platform
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: srikaya-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: srikaya-platform
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: auth-service
    app.kubernetes.io/part-of: srikaya-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: auth-service
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: auth-service
          image: srikaya/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: AUTH_SERVICE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: srikaya-secret
                  key: JWT_SECRET
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: NODE_ENV
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: auth-service
    app.kubernetes.io/part-of: srikaya-platform

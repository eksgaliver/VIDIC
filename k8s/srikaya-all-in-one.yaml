              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: AUTH_SERVICE_URL
            - name: SHIFTING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: SHIFTING_SERVICE_URL
            - name: STORAGE_SERVICE_URL

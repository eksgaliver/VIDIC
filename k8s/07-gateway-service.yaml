apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: gateway-service
    app.kubernetes.io/part-of: srikaya-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: gateway-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: gateway-service
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: gateway-service
          image: srikaya/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: GATEWAY_PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: AUTH_SERVICE_URL
            - name: SHIFTING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: SHIFTING_SERVICE_URL
            - name: STORAGE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: STORAGE_SERVICE_URL
            - name: STORAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: STORAGE_DIR
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: NODE_ENV
          volumeMounts:
            - name: media-storage
              mountPath: /storage
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: srikaya-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: gateway-service
    app.kubernetes.io/part-of: srikaya-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: gateway-service

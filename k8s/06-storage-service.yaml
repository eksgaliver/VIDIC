apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: storage-service
    app.kubernetes.io/part-of: srikaya-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: srikaya
      app.kubernetes.io/component: storage-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srikaya
        app.kubernetes.io/component: storage-service
        app.kubernetes.io/part-of: srikaya-platform
    spec:
      containers:
        - name: storage-service
          image: srikaya/storage-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: STORAGE_SERVICE_PORT
            - name: STORAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: STORAGE_DIR
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: srikaya-config
                  key: NODE_ENV
          volumeMounts:
            - name: media-storage
              mountPath: /storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: media-storage
          persistentVolumeClaim:
            claimName: srikaya-media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service
  namespace: srikaya-system
  labels:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: storage-service
    app.kubernetes.io/part-of: srikaya-platform
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3002
      targetPort: 3002
  selector:
    app.kubernetes.io/name: srikaya
    app.kubernetes.io/component: storage-service
